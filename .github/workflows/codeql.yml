# Generated from vhco-pro/.github workflow-templates/codeql-go.yml

name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "33 4 * * 2"

# Least-privilege at top level; reusable workflow raises per-job.
permissions: {}


jobs:
  analyze:
    if: ${{ github.event.repository.visibility == 'public' }}
    uses: vhco-pro/.github/.github/workflows/reusable-codeql-go.yml@6e1745d6f673185a0ae99075a8de9eb2e292c5ba # v1.2.2
    with:
      # Track go.mod (synced from the monorepo) so the analyzer never falls behind the
      # module's Go requirement; CodeQL runs with GOTOOLCHAIN=local and cannot self-upgrade.
      go-version-file: go.mod
    permissions:
      security-events: write
      contents: read
      actions: read
