# Generated from vhco-pro/.github workflow-templates/codeql-go.yml

name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "33 4 * * 2"

# Least-privilege at top level; reusable workflow raises per-job.
permissions: {}


jobs:
  analyze:
    if: ${{ github.event.repository.visibility == 'public' }}
    uses: vhco-pro/.github/.github/workflows/reusable-codeql-go.yml@2d2bc074b8c4c6d7648a0221102a88b61c7b70d7 # v1.2.1
    with:
      # Track go.mod (synced from the monorepo) so the analyzer never falls behind the
      # module's Go requirement; CodeQL runs with GOTOOLCHAIN=local and cannot self-upgrade.
      go-version-file: go.mod
    permissions:
      security-events: write
      contents: read
      actions: read
